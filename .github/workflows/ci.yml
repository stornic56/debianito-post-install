name: CI
on: [push, pull_request]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install bats + shellcheck
        run: apt-get update && apt-get install -y bats shellcheck
      - name: Shellcheck (entry point + all modules)
        shell: bash
        run: |
          shopt -s globstar
          shellcheck --severity=warning debianito.sh modules/**/*.sh
      - name: BATS test suite
        run: bats tests/
